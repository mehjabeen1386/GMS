# Purpose: Multi-Container Docker Compose Orchestration
# Path: docker-compose.yml

version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: apex_postgres
    environment:
      POSTGRES_USER: apex_user
      POSTGRES_PASSWORD: apex_secure_password
      POSTGRES_DB: apex_garments_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - apex_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U apex_user -d apex_garments_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: apex_redis
    ports:
      - "6379:6379"
    networks:
      - apex_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: apex_backend
    environment:
      - NODE_ENV=production
      - PORT=5000
      - DATABASE_URL=postgresql://apex_user:apex_secure_password@postgres:5432/apex_garments_db
      - REDIS_URL=redis://redis:6379
      - JWT_SECRET=apex_super_secret_jwt_key_2026
    ports:
      - "5000:5000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - apex_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: apex_frontend
    environment:
      - NODE_ENV=production
      - PORT=3000
      - NEXT_PUBLIC_API_URL=http://localhost:5000/api
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - apex_network

volumes:
  postgres_data:

networks:
  apex_network:
    driver: bridge